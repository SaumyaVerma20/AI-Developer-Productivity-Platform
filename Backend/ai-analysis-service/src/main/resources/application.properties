server.port=8084

spring.application.name=ai-analysis-service

spring.datasource.url=jdbc:postgresql://localhost:5432/aiops
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=ai-analysis-group
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.aiops.ai_analysis_service.dto.IncidentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false