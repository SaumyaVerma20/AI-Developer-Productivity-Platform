# ===========================================
# Application
# ===========================================
spring.application.name=ai-analysis-service
server.port=8083

# ===========================================
# PostgreSQL
# ===========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_analysisdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===========================================
# Kafka
# ===========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=ai-analysis-group-v2
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.aiops.ai_analysis_service.dto.IncidentEvent

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===========================================
# Ollama
# ===========================================
spring.ai.ollama.base-url=http://localhost:11434

# Chat Model
spring.ai.ollama.chat.options.model=llama3.2:1b

# Embedding Model
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest

# ===========================================
# Qdrant Vector Database
# ===========================================
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=incident-analysis
spring.ai.vectorstore.qdrant.initialize-schema=true

# ===========================================
# Logging
# ===========================================
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.aiops=DEBUG