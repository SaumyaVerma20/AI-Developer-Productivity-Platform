spring.application.name=api-gateway

server.port=8080

# ============================
# Incident Service
# ============================
spring.cloud.gateway.mvc.routes[0].id=incident-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/incidents/**,/api/v1/dashboard/**

# ============================
# Auth Service
# ============================
spring.cloud.gateway.mvc.routes[1].id=auth-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/auth/**

# ============================
# Notification Service
# ============================
spring.cloud.gateway.mvc.routes[2].id=notification-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/notifications/**

# ============================
# AI Analysis Service
# ============================
spring.cloud.gateway.mvc.routes[3].id=ai-analysis-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/analysis/**

# ============================
# Logging Service
# ============================
spring.cloud.gateway.mvc.routes[4].id=logging-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/v1/logs/**

# ============================
# Actuator
# ============================
management.endpoints.web.exposure.include=*

logging.level.org.springframework.cloud.gateway=DEBUG