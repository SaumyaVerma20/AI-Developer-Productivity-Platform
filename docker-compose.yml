
services:
  postgres:
    image: postgres:16
    container_name: aiops-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-service:
    build:
      context: ./Backend/auth-service
      dockerfile: Dockerfile
    container_name: aiops-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=authdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres

  incident-service:
    build:
      context: ./Backend/incident-service
      dockerfile: Dockerfile
    container_name: aiops-incident-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=incidentdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres

  log-service:
    build:
      context: ./Backend/log-service
      dockerfile: Dockerfile
    container_name: aiops-log-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=logdb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiops-frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - incident-service

volumes:
  postgres_data:
